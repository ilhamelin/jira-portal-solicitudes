<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5144" />
      <stop offset="50%" stop-color="#0d4037" />
      <stop offset="100%" stop-color="#072722" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo redondeado estilo app corporativa -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Capas de solicitudes estilizadas (Stack) -->
  <g filter="url(#glow)">
    <!-- Capa inferior -->
    <path d="M16 38 L32 46 L48 38 L32 30 Z" fill="#047857" opacity="0.6"/>
    <!-- Capa intermedia -->
    <path d="M16 31 L32 39 L48 31 L32 23 Z" fill="#10b981" opacity="0.85"/>
    <!-- Capa superior con gradiente brillante -->
    <path d="M16 24 L32 32 L48 24 L32 16 Z" fill="url(#accentGrad)"/>
    <!-- Destello de sincronización Jira -->
    <circle cx="44" cy="20" r="4.5" fill="#38bdf8" />
    <circle cx="44" cy="20" r="2.5" fill="#ffffff" />
  </g>
</svg>
